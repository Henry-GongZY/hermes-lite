# hermes-core agent loop verified on the Zephyr kernel (native_sim build).
# The real zsock/mbedTLS/littlefs backend is compiled in; the demo itself
# drives the agent with scripted responses so it needs no network.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# real backend (used on real boards)
CONFIG_HL_PLATFORM_ZEPHYR=y
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
# TLS: enable CONFIG_NET_SOCKETS_SOCKOPT_TLS=y on real boards. Left off in
# this CI-style sample because Zephyr 4.5.0's sockets_tls needs mbedtls
# symbols that don't resolve in a minimal west module set (see README).

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536
# Zephyr 4.5.0 + gnuarmemb quirks
CONFIG_FS_LITTLEFS_FMP_DEV=y

CONFIG_FLASH_MAP=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
# no host-networking plumbing needed for the scripted self-test
CONFIG_NET_QEMU_SLIP=n
CONFIG_NET_SLIP_TAP=n
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y
