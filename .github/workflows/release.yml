name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build firmware
        run: |
          . "$IDF_PATH/export.sh"
          cd examples/esp32
          idf.py set-target esp32
          idf.py build
          mkdir -p stage
          cp -r skills stage/
          python "$IDF_PATH/components/spiffs/spiffsgen.py" --obj-name-len 64 1572864 stage skills.img
      - name: Package
        run: |
          mkdir -p dist
          cp examples/esp32/build/bootloader/bootloader.bin dist/bootloader.bin
          cp examples/esp32/build/partition_table/partition-table.bin dist/partition-table.bin
          cp examples/esp32/build/hermes_lite_esp32.bin dist/hermes-lite-esp32.bin
          cp examples/esp32/skills.img dist/skills.img
          cd dist
          tar czf ../hermes-lite-esp32-firmware.tar.gz *
      - uses: softprops/action-gh-release@v2
        with:
          files: hermes-lite-esp32-firmware.tar.gz
